name: Update SKK Mihomo MRS

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the upstream Clash tree is unchanged
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types:
      - skk-rules-updated

permissions:
  contents: write

concurrency:
  group: update-skk-mrs-${{ github.ref }}
  cancel-in-progress: false

env:
  SKK_REPOSITORY: SukkaLab/ruleset.skk.moe
  SKK_REF: master
  OUTPUT_DIR: rules/skk

jobs:
  update:
    name: Build and publish MRS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out this repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out SKK Clash rules
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SKK_REPOSITORY }}
          ref: ${{ env.SKK_REF }}
          path: .upstream/skk
          sparse-checkout: |
            Clash
            LICENSE

      - name: Read upstream revision
        id: upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          sha="$(git -C .upstream/skk rev-parse HEAD)"
          tree="$(git -C .upstream/skk rev-parse HEAD:Clash)"
          {
            echo "sha=$sha"
            echo "tree=$tree"
            echo "short_tree=${tree:0:12}"
          } >> "$GITHUB_OUTPUT"

      - name: Check whether a rebuild is needed
        id: rebuild
        shell: bash
        run: |
          set -Eeuo pipefail

          current_tree="$(cat "$OUTPUT_DIR/.upstream-tree" 2>/dev/null || true)"
          current_builder="$(cat "$OUTPUT_DIR/.builder-sha256" 2>/dev/null || true)"
          builder_sha="$(
            sha256sum \
              scripts/build-skk-mrs.sh \
              .github/workflows/update-skk-mrs.yml \
              | sha256sum | cut -d ' ' -f 1
          )"

          required=false
          if [[ "$current_tree" != "${{ steps.upstream.outputs.tree }}" ]]; then
            required=true
            echo "Upstream Clash tree changed."
          fi
          if [[ "$current_builder" != "$builder_sha" ]]; then
            required=true
            echo "Builder changed."
          fi
          if [[ ! -d "$OUTPUT_DIR/domainset" || ! -d "$OUTPUT_DIR/ip" ]]; then
            required=true
            echo "Generated output is missing."
          fi
          if [[ "${{ inputs.force }}" == "true" ]]; then
            required=true
            echo "A forced rebuild was requested."
          fi

          {
            echo "required=$required"
            echo "builder_sha=$builder_sha"
          } >> "$GITHUB_OUTPUT"

          if [[ "$required" == "false" ]]; then
            echo "SKK Clash rules are already current."
          fi

      - name: Download current Mihomo
        id: mihomo
        if: steps.rebuild.outputs.required == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          api_url="https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"
          release_json="$(
            curl --fail --silent --show-error --location --retry 3 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api_url"
          )"

          version="$(jq -er '.tag_name' <<< "$release_json")"
          asset_name="mihomo-linux-amd64-compatible-${version}.gz"
          asset_url="$(
            jq -er --arg name "$asset_name" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              <<< "$release_json"
          )"
          expected_digest="$(
            jq -r --arg name "$asset_name" \
              '.assets[] | select(.name == $name) | .digest // empty' \
              <<< "$release_json"
          )"

          archive="$RUNNER_TEMP/$asset_name"
          binary="$RUNNER_TEMP/mihomo"
          curl --fail --silent --show-error --location --retry 3 \
            "$asset_url" -o "$archive"

          if [[ "$expected_digest" == sha256:* ]]; then
            actual_digest="sha256:$(sha256sum "$archive" | cut -d ' ' -f 1)"
            [[ "$actual_digest" == "$expected_digest" ]] || {
              echo "Mihomo checksum mismatch" >&2
              exit 1
            }
          fi

          gzip -dc "$archive" > "$binary"
          chmod 0755 "$binary"
          "$binary" -v

          {
            echo "path=$binary"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Convert compatible SKK rules
        if: steps.rebuild.outputs.required == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/build-skk-mrs.sh \
            .upstream/skk/Clash \
            "$OUTPUT_DIR" \
            "${{ steps.mihomo.outputs.path }}"

          printf '%s\n' "${{ steps.upstream.outputs.tree }}" \
            > "$OUTPUT_DIR/.upstream-tree"
          printf '%s\n' "${{ steps.mihomo.outputs.version }}" \
            > "$OUTPUT_DIR/.mihomo-version"
          printf '%s\n' "${{ steps.rebuild.outputs.builder_sha }}" \
            > "$OUTPUT_DIR/.builder-sha256"
          cp .upstream/skk/LICENSE "$OUTPUT_DIR/LICENSE"

          cat > "$OUTPUT_DIR/NOTICE.md" <<'EOF'
          # SKK Ruleset attribution

          These MRS files were generated from the Mihomo-compatible Clash output
          published by [Sukka Ruleset](https://github.com/SukkaLab/ruleset.skk.moe).

          - Clash tree: `${{ steps.upstream.outputs.tree }}`
          - Converter: Mihomo `${{ steps.mihomo.outputs.version }}`
          - `domainset/*.mrs`: AGPL-3.0
          - `ip/china_ip.mrs` and `ip/china_ip_ipv6.mrs`: CC BY-SA 2.0

          Only rule sets that Mihomo can represent losslessly as `domain` or
          `ipcidr` MRS are included. SKK `Clash/non_ip` and the other `Clash/ip`
          files use `classical` behavior and are intentionally not converted.
          EOF

          file_count="$(find "$OUTPUT_DIR" -type f -name '*.mrs' | wc -l)"
          ((file_count > 0))
          {
            echo "## SKK MRS build"
            echo
            echo "- Upstream commit: \`${{ steps.upstream.outputs.sha }}\`"
            echo "- Clash tree: \`${{ steps.upstream.outputs.tree }}\`"
            echo "- Mihomo: \`${{ steps.mihomo.outputs.version }}\`"
            echo "- MRS files: \`$file_count\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit changed rules
        if: steps.rebuild.outputs.required == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$GITHUB_REF_TYPE" == "branch" ]] || {
            echo "Refusing to publish from non-branch ref: $GITHUB_REF" >&2
            exit 1
          }

          git add -A -- "$OUTPUT_DIR"
          if git diff --cached --quiet; then
            echo "SKK rules are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(rules): update SKK MRS to ${{ steps.upstream.outputs.short_tree }}"
          git push origin "HEAD:$GITHUB_REF_NAME"
